name: Collect EV charger availability

on:
  schedule:
    # BACKUP ONLY. GitHub's scheduler is best-effort and skips most of these.
    # The real 30-min trigger is an external cron (cron-job.org) calling
    # POST /repos/zackhng/ev-charging-sg/actions/workflows/collect.yml/dispatches
    # Duplicate triggers are harmless: unchanged feeds are skipped.
    - cron: '9,39 * * * *'
  workflow_dispatch:        # external cron + the "Run workflow" button

permissions:
  contents: write           # needed so the job can commit the data back

concurrency:
  group: ev-collect         # never let two runs fight over the same commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # check out the branch as it is NOW, not as it was when the run was
          # queued — otherwise a queued run starts from stale data/.last_feed,
          # re-writes rows, and its rebase can conflict on the .csv.gz
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Poll the LTA feed once
        env:
          LTA_KEY: ${{ secrets.LTA_KEY }}
          TZ: Asia/Singapore
        run: python ev_collect.py once --dir data

      - name: Commit whatever it wrote
        run: |
          git config user.name  "ev-collector"
          git config user.email "actions@github.com"
          git add data
          if git diff --staged --quiet; then
            echo "nothing new this run"
          else
            git commit -m "data: $(TZ=Asia/Singapore date '+%Y-%m-%d %H:%M SGT')"
            git pull --rebase --autostash
            git push
          fi
